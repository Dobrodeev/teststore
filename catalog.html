<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Каталог канцтоваров — КанцМаркет Киев</title>
  <meta name="description" content="Полный каталог канцтоваров в Киеве: ручки, тетради, папки, бумага, маркеры, товары для рисования. Фильтр по категориям.">
  <link rel="canonical" href="https://kanzmarket.kiev.ua/catalog.html">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body>

<header>
  <div class="header-top">
    <a href="index.html" class="logo">
      <div class="logo-icon"><i data-lucide="pencil"></i></div>
      <div>
        <div class="logo-text">Канц<span>Маркет</span></div>
        <div class="logo-sub">Канцтовары в Киеве</div>
      </div>
    </a>
    <form class="search-box" id="search-form" role="search">
      <input type="text" id="search-input" placeholder="Найти ручки, тетради, маркеры..." aria-label="Поиск">
      <button type="submit" aria-label="Найти"><i data-lucide="search"></i></button>
    </form>
    <div class="header-actions">
      <a href="kontakty.html" class="btn-icon">
        <i data-lucide="phone"></i>
        <span>Контакты</span>
      </a>
      <button class="btn-icon cart-btn" onclick="openCart()" aria-label="Корзина">
        <i data-lucide="shopping-cart"></i>
        <span>Корзина</span>
        <span class="cart-count" style="display:none">0</span>
      </button>
    </div>
    <button class="burger" id="burger" aria-label="Меню">
      <i data-lucide="menu"></i>
    </button>
  </div>
  <nav class="header-nav" id="header-nav">
    <div class="container">
      <a href="index.html">Главная</a>
      <a href="catalog.html" class="active">Каталог</a>
      <a href="catalog.html?cat=ruchki">Ручки</a>
      <a href="catalog.html?cat=tetradi">Тетради</a>
      <a href="catalog.html?cat=bumaga">Бумага</a>
      <a href="catalog.html?cat=ofis">Офис</a>
      <a href="catalog.html?cat=risovanie">Рисование</a>
      <a href="o-nas.html">О нас</a>
      <a href="kontakty.html">Контакты</a>
    </div>
  </nav>
</header>

<div class="breadcrumb">
  <div class="container">
    <a href="index.html">Главная</a>
    <i data-lucide="chevron-right"></i>
    <span id="bc-current">Каталог</span>
  </div>
</div>

<section class="section" style="padding-top:32px;">
  <div class="container">
    <div class="catalog-layout">

      <!-- Фильтры -->
      <aside>
        <div class="filters-panel">
          <div class="filter-title">Категории</div>
          <div class="filter-list" id="cat-filter">
            <button class="filter-item active" data-cat="all">
              Все товары <span class="filter-count" id="cnt-all">0</span>
            </button>
            <!-- категории загружаются из JSON -->
          </div>
          <div class="filter-title" style="margin-top:20px;">Наличие</div>
          <div class="filter-list">
            <button class="filter-item active" data-stock="all" id="stock-all">Все</button>
            <button class="filter-item" data-stock="yes" id="stock-yes">В наличии</button>
          </div>
          <div class="filter-title" style="margin-top:20px;">Акции</div>
          <div class="filter-list">
            <button class="filter-item" data-badge="Хит" id="badge-hit">
              <i data-lucide="flame"></i> Хиты
            </button>
            <button class="filter-item" data-badge="Скидка" id="badge-sale">
              <i data-lucide="tag"></i> Скидки
            </button>
            <button class="filter-item" data-badge="Топ" id="badge-top">
              <i data-lucide="star"></i> Топ
            </button>
          </div>
        </div>
      </aside>

      <!-- Товары -->
      <div>
        <div class="catalog-top">
          <div class="catalog-count" id="catalog-count">Загрузка...</div>
          <div class="catalog-sort">
            <select id="sort-select" onchange="applyFilters()">
              <option value="default">По умолчанию</option>
              <option value="price-asc">Цена: по возрастанию</option>
              <option value="price-desc">Цена: по убыванию</option>
              <option value="name">По алфавиту</option>
            </select>
          </div>
        </div>
        <div class="products-grid" id="catalog-grid">
          <div style="grid-column:1/-1; text-align:center; padding:40px; color:var(--gray);">Загрузка...</div>
        </div>
      </div>

    </div>
  </div>
</section>

<!-- КОРЗИНА -->
<div class="cart-overlay" id="cart-overlay"></div>
<div class="cart-panel" id="cart-panel">
  <div class="cart-header">
    <h3><i data-lucide="shopping-cart"></i> Корзина</h3>
    <button class="cart-close" onclick="closeCart()"><i data-lucide="x"></i></button>
  </div>
  <div class="cart-items" id="cart-items"></div>
  <div class="cart-footer">
    <div class="cart-total">
      <span>Итого:</span>
      <span class="cart-total-val" id="cart-total">0 грн</span>
    </div>
    <a href="kontakty.html" class="btn btn-primary btn-full" onclick="closeCart()">Оформить заказ</a>
  </div>
</div>

<footer>
  <div class="footer-bottom" style="max-width:1160px; margin:0 auto; padding:24px 20px; border-top:none; justify-content:center;">
    <span>© 2026 КанцМаркет — <a href="index.html" style="color:#64748B">Канцтовары в Киеве</a></span>
  </div>
</footer>

<script src="js/app.js"></script>
<script>
  let allProducts = [];
  let allCats = [];
  let activeCat = 'all';
  let activeBadge = null;
  let activeStock = 'all';

  const params = new URLSearchParams(location.search);
  if (params.get('cat')) activeCat = params.get('cat');
  if (params.get('q')) document.getElementById('search-input').value = params.get('q');
  if (params.get('badge')) activeBadge = params.get('badge');

  async function initCatalog() {
    [allCats, allProducts] = await Promise.all([
      fetch('data/categories.json').then(r => r.json()),
      fetch('data/products.json').then(r => r.json())
    ]);
    _products = allProducts;

    document.getElementById('cnt-all').textContent = allProducts.length;

    // Кнопки категорий
    const list = document.getElementById('cat-filter');
    allCats.forEach(c => {
      const cnt = allProducts.filter(p => p.category === c.id).length;
      const btn = document.createElement('button');
      btn.className = 'filter-item' + (activeCat === c.id ? ' active' : '');
      btn.dataset.cat = c.id;
      btn.innerHTML = `<i data-lucide="${c.lucideIcon}"></i> ${c.name} <span class="filter-count">${cnt}</span>`;
      btn.onclick = () => setCat(c.id);
      list.appendChild(btn);
    });

    list.querySelector('[data-cat="all"]').onclick = () => setCat('all');
    if (activeCat !== 'all') {
      list.querySelector('[data-cat="all"]').classList.remove('active');
    }

    // Badge-фильтры
    ['badge-hit','badge-sale','badge-top'].forEach(id => {
      const el = document.getElementById(id);
      if (el) {
        const badge = el.dataset.badge;
        if (activeBadge === badge) el.classList.add('active');
        el.onclick = () => {
          activeBadge = activeBadge === badge ? null : badge;
          document.querySelectorAll('[data-badge]').forEach(b => b.classList.remove('active'));
          if (activeBadge) el.classList.add('active');
          applyFilters();
        };
      }
    });

    // Stock-фильтры
    document.getElementById('stock-all').onclick = () => { activeStock = 'all'; updateStockBtns(); applyFilters(); };
    document.getElementById('stock-yes').onclick = () => { activeStock = 'yes'; updateStockBtns(); applyFilters(); };

    applyFilters();
    refreshIcons();
  }

  function updateStockBtns() {
    document.getElementById('stock-all').className = 'filter-item' + (activeStock === 'all' ? ' active' : '');
    document.getElementById('stock-yes').className = 'filter-item' + (activeStock === 'yes' ? ' active' : '');
  }

  function setCat(cat) {
    activeCat = cat;
    document.querySelectorAll('[data-cat]').forEach(b => b.classList.remove('active'));
    document.querySelector(`[data-cat="${cat}"]`)?.classList.add('active');
    applyFilters();
    if (cat === 'all') {
      document.getElementById('bc-current').textContent = 'Каталог';
    } else {
      const c = allCats.find(x => x.id === cat);
      document.getElementById('bc-current').textContent = c ? c.name : 'Каталог';
    }
  }

  function applyFilters() {
    const q = document.getElementById('search-input').value.trim().toLowerCase();
    const sort = document.getElementById('sort-select').value;

    let result = allProducts.filter(p => {
      if (activeCat !== 'all' && p.category !== activeCat) return false;
      if (activeBadge && p.badge !== activeBadge) return false;
      if (activeStock === 'yes' && !p.inStock) return false;
      if (q && !p.name.toLowerCase().includes(q) && !p.desc.toLowerCase().includes(q)) return false;
      return true;
    });

    if (sort === 'price-asc') result.sort((a, b) => a.price - b.price);
    else if (sort === 'price-desc') result.sort((a, b) => b.price - a.price);
    else if (sort === 'name') result.sort((a, b) => a.name.localeCompare(b.name, 'ru'));

    document.getElementById('catalog-count').textContent =
      `Найдено: ${result.length} ${pluralize(result.length, 'товар', 'товара', 'товаров')}`;

    if (result.length === 0) {
      document.getElementById('catalog-grid').innerHTML = `
        <div class="no-results">
          <i data-lucide="search-x" style="width:56px;height:56px;stroke:var(--border);margin:0 auto 16px;"></i>
          <h3>Ничего не найдено</h3>
          <p>Попробуйте изменить критерии поиска или выбрать другую категорию</p>
          <button class="btn btn-outline" style="margin-top:20px" onclick="resetFilters()">Сбросить фильтры</button>
        </div>`;
    } else {
      document.getElementById('catalog-grid').innerHTML = result.map(renderProductCard).join('');
    }
    refreshIcons();
  }

  function resetFilters() {
    activeCat = 'all';
    activeBadge = null;
    activeStock = 'all';
    document.getElementById('search-input').value = '';
    document.querySelectorAll('[data-cat]').forEach(b => b.classList.remove('active'));
    document.querySelector('[data-cat="all"]')?.classList.add('active');
    document.querySelectorAll('[data-badge]').forEach(b => b.classList.remove('active'));
    updateStockBtns();
    applyFilters();
  }

  function pluralize(n, one, few, many) {
    const mod10 = n % 10, mod100 = n % 100;
    if (mod10 === 1 && mod100 !== 11) return one;
    if ([2,3,4].includes(mod10) && ![12,13,14].includes(mod100)) return few;
    return many;
  }

  initCatalog();
</script>
</body>
</html>
